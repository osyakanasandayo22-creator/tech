  <link rel="apple-touch-icon" href="img/favicon.png" />

  <link rel="stylesheet" href="css/style.css" />

<body class="subpage">
  <header class="header is-scrolled" id="header">
    <div class="shell header__inner">
      <a href="index.html#hero" class="logo"><img src="img/logo.png" alt="テック・スマイル こどもプログラミング教室" width="144" height="96" /></a>
      <nav class="nav" id="nav" aria-label="メインナビ">
        <ul class="nav__list">
          <li><a href="about.html" class="nav__link">テックスマイルとは</a></li>
          <li><a href="courses.html" class="nav__link">コース・料金</a></li>
          <li><a href="voice.html" class="nav__link is-active" aria-current="page">体験談</a></li>
          <li><a href="faq.html" class="nav__link">Q&amp;A</a></li>
          <li><a href="news.html" class="nav__link">お知らせ</a></li>
          <li><a href="access.html" class="nav__link">アクセス</a></li>
        </ul>
      </nav>
      <a href="index.html#contact" class="btn btn--primary header__cta">無料体験</a>
      <button class="nav-toggle" id="navToggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="nav">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="subhero">
      <span class="blob blob--lime dots blob--deco1 js-float" data-speed="0.05"></span>
      <span class="blob blob--coral blob--deco2 js-float" data-speed="-0.05"></span>
      <div class="shell subhero__inner">
        <h1 class="subhero__en">Voice</h1>
        <p class="subhero__jp">みんなの声</p>
        <nav class="crumb" aria-label="パンくず">
          <a href="index.html#hero">Home</a> <span>/</span> <span aria-current="page">体験談</span>
        </nav>
      </div>
    </section>

    <div class="page">
      <div class="shell">
        <div class="voice__grid voice__grid--few">
          <figure class="voice__card">
            <div class="voice__stars" aria-label="星5">★★★★★</div>
            <blockquote>ゲームづくりがたのしい！おうちでもじぶんでつづきをつくってるよ。</blockquote>
            <figcaption>ハルトくん（9歳）</figcaption>
          </figure>
          <figure class="voice__card">
            <div class="voice__stars" aria-label="星5">★★★★★</div>
            <blockquote>人見知りな子が、自分で考えたゲームを自信満々に話してくれるようになりました。少人数なので質問もしやすいみたいです。</blockquote>
            <figcaption>小3の保護者さま</figcaption>
          </figure>
          <figure class="voice__card">
            <div class="voice__stars" aria-label="星5">★★★★★</div>
            <blockquote>小学4年生からこの教室に通い始めました。月2回の授業を通して、プログラミングへの理解が深まり、興味や好奇心も広がりました。アットホームで居心地の良い環境なので、楽しみながら学ぶことができました。初心者でも安心して通える教室だと思います。</blockquote>
            <figcaption>陽日さん（高校2年）</figcaption>
          </figure>
        </div>
      </div>
    </div>

    <section class="cta-band">
      <div class="shell">
        <div class="cta-band__inner">
          <span class="blob blob--yellow dots js-float" data-speed="0.04" style="width:160px;height:160px;top:-30px;left:-30px;"></span>
          <span class="blob blob--pink js-float" data-speed="-0.04" style="width:140px;height:140px;bottom:-40px;right:-20px;"></span>
          <h2 class="cta-band__title">次は、あなたの番です。</h2>
          <p class="cta-band__text">お子さまの「楽しい！」を、いっしょに見つけましょう。</p>
          <a href="index.html#contact" class="btn btn--white btn--lg">無料体験を申し込む</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="shell footer__inner">
      <a href="index.html#hero" class="footer__logo"><img src="img/logo.png" alt="テック・スマイル" width="144" height="96" /></a>

      </nav>
    </div>

  </footer>
